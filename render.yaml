services:
  - type: web
    name: reschedule-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENV
        value: prod
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
      - key: STT_URL
        value: https://api.groq.com/openai/v1
      - key: STT_KEY
        sync: false
      - key: STT_MODEL
        value: whisper-large-v3-turbo
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
